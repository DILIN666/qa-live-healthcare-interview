version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-qa-live-healthcare
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qa_live_healthcare
      MYSQL_USER: qa_user
      MYSQL_PASSWORD: qa_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-qa-live-healthcare
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    restart: always

volumes:
  mysql_data:
    driver: local