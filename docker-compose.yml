version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qa-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: qa_live_healthcare
      MYSQL_USER: qa_user
      MYSQL_PASSWORD: qa_password123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - qa-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: qa-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123456
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - qa-network

volumes:
  mysql_data:

networks:
  qa-network:
    driver: bridge
